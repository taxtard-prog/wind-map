<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Wind Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet-Velocity CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-velocity@1.6.0/dist/leaflet-velocity.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { width: 100vw; height: 100vh; background: #222; }
        
        /* Style for the slider control box */
        #controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000; /* Keeps the box floating above the map */
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        
        input[type=range] {
            width: 200px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <!-- The Slider UI -->
    <div id="controls">
        <div>Forecast: <strong id="timeLabel">Current (0h)</strong></div>
        <!-- step="12" means the slider snaps directly from 0 to 12 -->
        <input type="range" id="timeSlider" min="0" max="12" step="12" value="0">
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet-Velocity JS -->
    <script src="https://unpkg.com/leaflet-velocity@1.6.0/dist/leaflet-velocity.min.js"></script>

    <script>
        // Initialize the map (Centered over the Mediterranean)
        const map = L.map('map').setView([35.9, 14.4], 5);

        // Add the dark base map
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        // We need a variable to keep track of the current wind layer
        let windLayer = null;

        // Function to load the correct JSON file based on the slider
        function loadWindData(hours) {
            
            // If there is already wind on the map, wipe it off first
            if (windLayer !== null) {
                map.removeLayer(windLayer);
            }

            // Fetch either wind-0h.json or wind-12h.json
            fetch(`data/wind-${hours}h.json`)
                .then(response => {
                    if (!response.ok) throw new Error("Data not found");
                    return response.json();
                })
                .then(data => {
                    windLayer = L.velocityLayer({
                        displayValues: true,
                        displayOptions: {
                            velocityType: 'Wind',
                            position: 'bottomleft',
                            emptyString: 'No wind data available'
                        },
                        data: data,
                        maxVelocity: 15,
                        velocityScale: 0.005,
                        colorScale: [
                            "rgb(36,104, 180)", "rgb(60,157, 194)", 
                            "rgb(128,205,193)", "rgb(151,218,168)", 
                            "rgb(198,231,181)", "rgb(238,247,217)", 
                            "rgb(255,238,159)", "rgb(252,217,125)", 
                            "rgb(255,182,100)", "rgb(252,150,75)", 
                            "rgb(250,112,52)",  "rgb(245,64,32)", 
                            "rgb(237,45,28)",   "rgb(220,24,32)", 
                            "rgb(180,0,35)"
                        ]
                    });
                    
                    windLayer.addTo(map);
                })
                .catch(err => console.error("Error loading wind data:", err));
        }

        // 1. Load the current wind (0h) as soon as the page opens
        loadWindData(0);

        // 2. Listen for the user moving the slider
        const slider = document.getElementById('timeSlider');
        const label = document.getElementById('timeLabel');

        slider.addEventListener('input', (e) => {
            const val = e.target.value;
            
            // Update the text label
            if (val == "0") {
                label.innerText = "Current (0h)";
            } else {
                label.innerText = "+12 Hours";
            }
            
            // Load the new data
            loadWindData(val);
        });
    </script>
</body>
</html>
